<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una carta para ti</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=Homemade+Apple&display=swap" rel="stylesheet">
<style>
:root{
  --sky:#1d2340; --sky2:#2b3158; --env:#d5e2f5; --env-shade:#a9c0e3;
  --seal:#1f4fa3; --paper:#f8fbff; --ink:#2b2433; --accent:#1f4fa3; --hint:#e9e4f2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--sky:#12162b;--sky2:#1d2340}}
:root[data-theme="dark"]{--sky:#12162b;--sky2:#1d2340}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(ellipse at 50% 0%,var(--sky2),var(--sky) 70%) fixed;
  color:var(--ink);font-family:"EB Garamond",Georgia,serif;
  display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px 16px;
}
.stage{width:100%;max-width:420px;text-align:center}
.hint{color:var(--hint);font-size:1.15rem;margin-top:28px;font-style:italic}

/* sobre */
.envelope{position:relative;width:100%;aspect-ratio:3/2;margin:0 auto;perspective:1200px;cursor:pointer;
  border:0;background:none;padding:0;display:block;transition:opacity .6s ease,transform .6s ease}
.envelope:focus-visible{outline:3px solid var(--hint);outline-offset:8px;border-radius:6px}
.body{position:absolute;inset:0;background:var(--env);border-radius:6px;box-shadow:0 18px 40px rgba(0,0,0,.45);overflow:hidden}
.body::before,.body::after{content:"";position:absolute;bottom:0;width:100%;height:100%}
.body::before{background:linear-gradient(to top right,var(--env-shade) 49.5%,transparent 50%) left/50% 100% no-repeat,
  linear-gradient(to top left,var(--env-shade) 49.5%,transparent 50%) right/50% 100% no-repeat}
.flap{position:absolute;top:0;left:0;width:100%;height:55%;transform-origin:top;transition:transform .7s ease .1s;z-index:3}
.flap::before{content:"";position:absolute;inset:0;background:var(--env-shade);
  clip-path:polygon(0 0,100% 0,50% 100%);border-radius:6px 6px 0 0}
.seal{position:absolute;left:50%;top:55%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;z-index:4;
  background:radial-gradient(circle at 35% 30%,#4b7fd6,var(--seal) 60%);box-shadow:0 3px 8px rgba(0,0,0,.4);
  display:grid;place-items:center;color:#e8f0ff;font:1.7rem "Homemade Apple",cursive;transition:opacity .3s}
.mini{position:absolute;left:8%;right:8%;top:10%;height:80%;background:var(--paper);border-radius:3px;z-index:1;transition:transform .8s ease .5s}
.opening .flap{transform:rotateX(180deg);z-index:0}
.opening .seal{opacity:0}
.opening .mini{transform:translateY(-38%)}
.gone{opacity:0;transform:scale(.96);pointer-events:none;position:absolute;visibility:hidden}

/* carta */
.letter{display:none;background:var(--paper);border-radius:6px;padding:40px 30px 36px;text-align:left;
  box-shadow:0 20px 50px rgba(0,0,0,.5);font-size:1.28rem;line-height:1.7;
  background-image:repeating-linear-gradient(transparent,transparent 33px,rgba(31,79,163,.07) 34px)}
.letter.show{display:block;animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
.letter h1{font-family:"Homemade Apple",cursive;font-weight:400;font-size:1.55rem;color:var(--accent);margin:0 0 22px;line-height:1.4}
.letter p{margin:0 0 1.1em;max-width:60ch}
.sign{font-family:"Homemade Apple",cursive;color:var(--accent);font-size:1.25rem;margin-top:26px!important}
.song{display:block;margin:34px auto 0;width:fit-content;max-width:100%;text-align:center;text-decoration:none;
  background:var(--seal);color:#fff;font:500 1.15rem "EB Garamond",Georgia,serif;padding:14px 26px;border-radius:999px;
  box-shadow:0 8px 20px rgba(31,79,163,.4);transition:transform .2s}
.song:hover{transform:translateY(-2px)}
.song:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

.polaroid{margin:34px auto 0;width:min(100%,300px);background:#fff;padding:12px 12px 18px;border-radius:3px;
  box-shadow:0 10px 26px rgba(20,35,80,.28);transform:rotate(-2deg)}
.polaroid img{display:block;width:100%;height:auto;border-radius:2px}
.polaroid figcaption{font-family:"Homemade Apple",cursive;color:var(--accent);font-size:.95rem;line-height:1.6;text-align:center;margin-top:14px}
.heart{position:fixed;top:-40px;z-index:20;pointer-events:none;color:#6f9be6;animation:fall linear forwards;will-change:transform}
@keyframes fall{to{transform:translate3d(var(--dx),110vh,0) rotate(var(--rot))}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01s!important;animation-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>

    <div class="body"></div>
    <div class="mini"></div>
    <div class="flap"></div>
    <div class="seal" aria-hidden="true">ღ</div>
  </button>
  <div class="hint" id="hint">Toca el sobre para abrirlo</div>

<script>
/* ====== EDITA AQUÍ ====== */
var PARA   = "Para el corazón más hermoso";
var DE     = "Del hombre que te ve, te sueña y te extraña.";
var CARTA  = [
  "Eres mi completa debilidad, tus ojos son inigualables, no puedo ignorar lo que siento cuando iluminas todo lugar por donde pasas, quiero vivir solamente por ti, dejar lo que impida poder estar juntos.",
  "Eres tan hermosa como el amanecer, tan bella como las mariposas en el verano y como un hermoso jardín de tulipanes, pero sin duda tú eres más hermosa que cualquier cosa en este mundo."
];
var CANCION = "https://open.spotify.com/intl-es/track/04CRXU9tqLWR6UTBu5bq9P";   /* pega aquí el enlace de la canción */
/* ======================== */

document.getElementById("to").textContent = PARA;
document.getElementById("from").textContent = DE;
document.getElementById("songBtn").href = CANCION;
var box = document.getElementById("text");
CARTA.forEach(function(t){var p=document.createElement("p");p.textContent=t;box.appendChild(p)});


function hearts(){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var n=0,t=setInterval(function(){
    var s=document.createElement("span");s.className="heart";s.textContent=Math.random()<.5?"♥":"♡";
    s.style.left=Math.random()*100+"vw";s.style.fontSize=(14+Math.random()*22)+"px";
    s.style.setProperty("--dx",(Math.random()*120-60)+"px");s.style.setProperty("--rot",(Math.random()*360-180)+"deg");
    s.style.animationDuration=(4+Math.random()*4)+"s";s.style.opacity=.5+Math.random()*.5;
    document.body.appendChild(s);setTimeout(function(){s.remove()},8500);
    if(++n>45)clearInterval(t);
  },140);
}
var env=document.getElementById("env"),letter=document.getElementById("letter"),hint=document.getElementById("hint"),done=false;
env.addEventListener("click",function(){
  if(done)return;done=true;
  env.classList.add("opening");hint.style.visibility="hidden";
  setTimeout(function(){env.classList.add("gone");hint.style.display="none";letter.classList.add("show");window.scrollTo(0,0);hearts()},1500);
});
</script>
